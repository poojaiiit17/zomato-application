<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Cart</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>🍴 Zomato</b><a href="/dashboard">Dashboard</a><a href="/orders">Orders</a></nav><main><h1>Your Cart</h1><div class="card" th:if="${#lists.isEmpty(items)}"><h2>Your cart is empty</h2><a href="/dashboard">Browse food</a></div><div class="card" th:each="item:${items}"><h2 th:text="${item.foodName}"></h2><p th:text="${item.restaurantName}"></p><p>₹ <span th:text="${item.price}"></span> × <span th:text="${item.quantity}"></span> = ₹<span th:text="${item.total}"></span></p><a class="danger" th:href="@{'/cart/remove?foodId='+${item.foodId}}">Remove</a></div><div th:if="${!#lists.isEmpty(items)}"><form method="post" action="/order/place"><button>Place Order</button></form></div></main></body></html>
