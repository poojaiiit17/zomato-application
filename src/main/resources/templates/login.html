<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Zomato Login</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="card auth"><h1>🍴 Zomato</h1><h2>Login</h2><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${message}" th:text="${message}"></p><form method="post" action="/login"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><button>Login</button></form><p>New user? <a href="/register">Create account</a></p></div></body></html>
