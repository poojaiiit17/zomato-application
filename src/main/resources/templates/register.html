<!DOCTYPE html><html><head><title>Zomato Register</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="card auth"><h1>🍴 Zomato</h1><h2>Create Account</h2><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/register"><input name="name" placeholder="Name" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><input name="phone" placeholder="Phone"><input name="address" placeholder="Address"><button>Register</button></form><p>Already registered? <a href="/login">Login</a></p></div></body></html>
