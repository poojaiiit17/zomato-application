<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Orders</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>🍴 Zomato</b><a href="/dashboard">Dashboard</a><a href="/cart">Cart 🛒</a><a href="/logout">Logout</a></nav><main><h1>My Orders</h1><p class="success" th:if="${message}" th:text="${message}"></p><div class="card" th:if="${#lists.isEmpty(orders)}"><h2>No orders yet.</h2></div><div class="card" th:each="order:${orders}"><h2>Order #<span th:text="${order.orderId}"></span></h2><p>Date: <span th:text="${order.orderDate}"></span></p><p>Total: ₹<b th:text="${order.totalAmount}"></b></p><p>Status: <b th:text="${order.status}"></b></p><form th:if="${order.status=='PLACED'}" method="post" action="/order/cancel"><input type="hidden" name="orderId" th:value="${order.orderId}"><button class="danger">Cancel Order</button></form></div></main></body></html>
