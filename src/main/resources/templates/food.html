<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Food</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>🍴 Zomato</b><a href="/dashboard">Dashboard</a><a href="/cart">Cart 🛒</a></nav><main><div class="card"><div class="bigemoji">🍕</div><h1 th:text="${food.foodName}"></h1><h3 th:text="${food.restaurantName}"></h3><p th:text="${food.description}"></p><p>Category: <b th:text="${food.category}"></b></p><h2>₹ <span th:text="${food.price}"></span></h2><form method="post" action="/cart/add"><input type="hidden" name="foodId" th:value="${food.foodId}"><button>Add to Cart</button></form></div></main></body></html>
