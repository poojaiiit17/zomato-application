<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Zomato Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>🍴 Zomato</b><span>Hi, <span th:text="${userName}"></span></span><a href="/cart">Cart 🛒</a><a href="/orders">Orders</a><a href="/logout">Logout</a></nav><main><h1>What would you like to eat?</h1><div class="grid"><div class="food-card" th:each="food:${foods}"><div class="emoji">🍛</div><h2 th:text="${food.foodName}"></h2><p th:text="${food.restaurantName}"></p><small th:text="${food.category}"></small><h3>₹ <span th:text="${food.price}"></span></h3><a class="button" th:href="@{'/food/'+${food.foodId}}">View Food</a></div></div></main></body></html>
